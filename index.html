<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Bảo Trì</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ef4444;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .highlight {
            color: #f43f5e;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>
        
        <h1>Server Ngừng Hoạt Động</h1>
        
        <p>Lý do nằm ở thằng cấp file (<span class="highlight">server crack by tlvm</span>)</p>
    </div>

</body>
</html>
