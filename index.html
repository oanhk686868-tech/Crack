<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP PAIN • EXCLUSIVE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#000,#140000,#360000);
height:100vh;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 30% 20%,rgba(255,0,0,.3),transparent),
radial-gradient(circle at 70% 70%,rgba(255,0,100,.3),transparent);
filter:blur(70px);
animation:move 8s infinite alternate;
}

@keyframes move{
100%{
transform:scale(1.3);
}
}

.box{
position:relative;
width:350px;
padding:25px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(15px);
border-radius:25px;
border:1px solid rgba(255,255,255,.1);
box-shadow:
0 0 25px red,
0 0 60px rgba(255,0,0,.5);
z-index:1;
}

.logo{
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:5px;
background:linear-gradient(red,#ff7777);
-webkit-background-clip:text;
color:transparent;
}

/* Style mới cho phần thông tin Crack */
.crack-by {
text-align:center;
font-size:13px;
font-weight:bold;
color:#ff4444;
text-shadow: 0 0 8px rgba(255,0,0,0.6);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#111;
color:white;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:red;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.panel{
display:none;
margin-top:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
margin:12px 0;
padding:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
}

.switch{
width:50px;
height:25px;
background:#333;
border-radius:20px;
cursor:pointer;
position:relative;
}

.circle{
position:absolute;
width:20px;
height:20px;
background:white;
border-radius:50%;
top:2.5px;
left:3px;
transition:.3s;
}

.active{
background:red;
}

.active .circle{
left:27px;
}

.loading{
display:none;
margin-top:10px;
}

.bar{
width:100%;
height:10px;
background:#222;
border-radius:20px;
overflow:hidden;
}

.fill{
width:0%;
height:100%;
background:red;
}

.text{
margin-top:6px;
font-size:13px;
text-align:center;
}

.warning{
color:red;
text-align:center;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
LOCK HEAD MODE
</div>

<div class="crack-by">
Crack by tlvm (@HL2109)
</div>

<div id="login">

<input id="key" placeholder="Nhập bất kỳ ký tự nào...">

<button onclick="checkKey()">
ĐĂNG NHẬP
</button>

<div class="warning" id="warn"></div>

</div>

<div class="panel" id="panel">

<div class="item">
<span>AIMLOCK</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="item">
<span>AIMHEAD</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="item">
<span>NHẸ TÂM</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="item">
<span>FIX RUNG</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="item">
<span>GHÌM TÂM</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="item">
<span>BOOTS GAME</span>
<div class="switch" onclick="toggle(this)">
<div class="circle"></div>
</div>
</div>

<div class="loading" id="load">

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="text" id="text">
Đang tải...
</div>

</div>

</div>

<audio id="sound">
<source src="https://www.soundjay.com/buttons/button-09.mp3">
</audio>

</div>

<script>

function checkKey(){
    // Đã loại bỏ điều kiện kiểm tra chuỗi. Nhập gì cũng nhận và chuyển thẳng vào panel.
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
}

function toggle(x){

x.classList.toggle("active");

document.getElementById("sound").play();

let load=document.getElementById("load");
let fill=document.getElementById("fill");
let text=document.getElementById("text");

load.style.display="block";

let i=0;

let t=setInterval(()=>{

i++;

fill.style.width=i+"%";

text.innerHTML=
"Đang Kích Hoạt "+i+"%";

if(i>=100){

clearInterval(t);

text.innerHTML=
"✓ Hoàn tất";

}

},20)

}

</script>

</body>
</html>
